name: macro_placement_env
class_path: src.models.macro_placement_env.MacroPlacementEnv

dataset:
  graph_path: src/data/preprocessed/real-connection/MemPool_tile/Nangate45/MemPool_tile_Nangate45_graph.pt
  metadata_path: src/data/preprocessed/real-connection/MemPool_tile/Nangate45/metadata-MemPool_tile-Nangate45.json
  connection_type: real-connection
  design: MemPool_tile
  technology: Nangate45

episode:
  max_steps: 200
  randomize_initial_positions: true
  initial_position_distribution: uniform
  seed: 42

observation:
  type: flattened_macro_features
  normalization:
    positions: unit_canvas
    node_features: preprocessed
  fields:
    - normalized_x
    - normalized_y
    - node_features
  dtype: float32
  low: 0.0
  high: 1.0

action_space:
  type: hierarchical_discrete
  manager_action: macro_index
  worker_action: movement_direction
  num_directions: 64
  encoded_action: macro_index * num_directions + direction_index
  movement_step: 0.05

reward:
  objective: minimize_hpwl_with_routability
  hpwl_scale: 0.001
  # Per-step episode-relative HPWL improvement reward.
  improvement_scale: 2.0
  # Per-step penalty for max_density degradation relative to episode start.
  # Uses the same metric as placement_benchmark.py (max bin density ratio).
  # Calibrated so that a 2x max_density increase is at break-even with a
  # 40% HPWL improvement; a 3x or greater increase is always net-negative.
  congestion_improvement_scale: 0.8
  # Fraction of initial max_density allowed to increase before the terminal
  # bonus is withheld and a proportional terminal penalty fires instead.
  congestion_tolerance: 0.5
  penalties:
    overlap:
      # Enabled with fixed approximate_overlap (now uses canvas-unit coords).
      # Prevents macro stacking: 2 macros at same pos incur a large penalty.
      enabled: true
      weight: 10.0
    density:
      enabled: false
      weight: 0.0
    congestion:
      enabled: true
      weight: 5.0
    boundary:
      enabled: true
      handled_by_clamp: true

canvas:
  default_size: [400.0, 400.0]
  coordinate_system: normalized_unit_square
  clamp_positions: true
